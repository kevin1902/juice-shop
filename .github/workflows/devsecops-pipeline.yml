name: DevSecOps CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  sast_scan:
    name: Analisis Estatico de Codigo (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar codigo fuente
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci
        # El pipeline continuara para generar el reporte completo
        continue-on-error: true

  sca_scan:
    name: Analisis de Composicion / Dependencias (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Escaneo de Dependencias con Snyk (SCA)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  dast_scan:
    name: Analisis Dinamico de Seguridad (DAST)
    runs-on: ubuntu-latest
    needs: [sast_scan, sca_scan]
    steps:
      - name: Levantar Juice Shop en el runner
        run: |
          docker run -d -p 3000:3000 --name juice bkimminich/juice-shop
          for i in $(seq 1 30); do
            curl -s http://localhost:3000 > /dev/null && break
            sleep 3
          done

      - name: Escaneo DAST con OWASP ZAP (Baseline)
        run: |
          chmod 777 "$PWD"
          docker run --rm --network host -v "$PWD":/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:3000 -r zap-report.html -I

      - name: Guardar reporte de ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
